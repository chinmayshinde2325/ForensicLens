name: ForensicLens CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install lightweight test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install fastapi httpx pydantic python-dotenv python-evtx xmltodict opensearch-py rich pytest

      - name: Compile Python modules
        run: python -m py_compile src/__init__.py src/config.py src/ingest.py src/sigma_triage.py src/query_cli.py src/app.py

      - name: Run unit tests
        run: pytest -v
